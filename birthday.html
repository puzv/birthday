<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日邀请</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #fdf6f9;
      text-align: center;
      padding: 40px 20px;
      color: #333;
    }
    .card {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 28px;
      color: #ff5e84;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }
    .info {
      margin: 20px 0;
      font-size: 16px;
      line-height: 1.8;
    }
    .label {
      color: #ff5e84;
      font-weight: bold;
    }
    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px;
      background: #ff5e84;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-size: 16px;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 生日邀请 🎉</h1>
    <p class="subtitle">诚邀你一起庆祝</p>

    <div class="info">
      <p><span class="label">主人公：</span>濮致微</p>
      <p><span class="label">日期：</span>2026年4月17日</p>
      <p><span class="label">时间：</span>晚上 18:00</p>
      <p><span class="label">地点：</span>不知道喵</p>
    </div>

    <a class="btn" href="https://jq.qq.com/?k=xxxx">点击确认出席</a>

    <div class="footer">
      期待与你一起度过温暖又开心的一天 ✨
    </div>
  </div>
</body>
</html>
